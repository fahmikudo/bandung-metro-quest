# Disajikan oleh nginx di dalam container. Host nginx hanya me-reverse-proxy ke sini.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # Proxy API publik prakiraan cuaca BMKG agar bebas CORS di browser.
    location = /api/bmkg {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $bmkg_upstream "https://api.bmkg.go.id/publik/prakiraan-cuaca$is_args$args";
        proxy_pass $bmkg_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host api.bmkg.go.id;
        proxy_set_header Accept application/json;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        add_header Cache-Control "public, max-age=600";
    }

    # Build output dengan content-hash bersifat immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Entry point non-hashed & file PWA selalu revalidasi agar rilis baru tidak nyangkut cache lama.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
    }

    # Fallback SPA ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
