# /etc/nginx/sites-available/manawi-bandung.conf
#
# Cloudflare menangani TLS (mode Flexible) dan origin menyajikan HTTP port 80.
# IP asli pengunjung datang dari konfigurasi bersama /etc/nginx/conf.d/cloudflare.conf.
#
# Melayani manawi.web.id; pastikan port upstream sama dengan APP_PORT di
# /opt/manawi-bandung/.env.
#
# Install:
#   sudo cp deploy/nginx/manawi-bandung.conf /etc/nginx/sites-available/manawi-bandung.conf
#   sudo ln -s /etc/nginx/sites-available/manawi-bandung.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream manawi_bandung {
    server 127.0.0.1:8700;
    keepalive 32;
}

# Alihkan www ke domain kanonik.
server {
    listen 80;
    listen [::]:80;
    server_name www.manawi.web.id;
    return 301 https://manawi.web.id$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name manawi.web.id;

    access_log /var/log/nginx/manawi-bandung.access.log;
    error_log  /var/log/nginx/manawi-bandung.error.log;

    client_max_body_size 10M;
    server_tokens off;

    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://manawi_bandung;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Literal https: hop ke origin HTTP, tapi pengunjung mengakses via HTTPS Cloudflare.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_redirect off;
    }
}
